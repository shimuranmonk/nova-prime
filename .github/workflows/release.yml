name: Build and publish release ZIP

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install
        run: npm install --ignore-scripts
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify release bundle
        run: npm run verify
      - name: Check tag and package versions
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - name: Package production application
        run: python scripts/package-release.py "${GITHUB_REF_NAME#v}"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Nova Prime ${{ github.ref_name }}
          generate_release_notes: true
          files: nova-prime-*-release.zip
